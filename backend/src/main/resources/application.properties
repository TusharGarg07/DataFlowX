spring.application.name=dataflowx
server.port=8080

# Use the PostgreSQL-oriented local profile unless another profile is selected.
spring.profiles.default=local

# Keep persistence behavior consistent across runtime profiles.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schema ownership: Flyway manages schema creation, Hibernate validates
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# CORS configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:5173}
