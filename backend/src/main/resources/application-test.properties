# Test persistence configuration backed by PostgreSQL Testcontainers
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Test security and service configurations
app.jwt.secret=test-only-secret-must-be-at-least-32-characters
app.jwt.expiration-ms=3600000
app.job.processing.failure-dataset-name=fail-processing
