# Isolated test persistence configuration; no local PostgreSQL installation is required.
spring.datasource.url=jdbc:h2:mem:dataflowx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=test-only-secret-must-be-at-least-32-characters
app.jwt.expiration-ms=3600000
app.job.processing.failure-dataset-name=fail-processing
