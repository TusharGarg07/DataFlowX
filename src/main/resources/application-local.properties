# Local PostgreSQL settings. Environment variables override these safe development defaults.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dataflowx}
spring.datasource.username=${DATABASE_USERNAME:dataflowx}
spring.datasource.password=${DATABASE_PASSWORD:dataflowx}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate schema generation supports the initial development stage; migrations are deferred.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Development-only fallback. Production must set JWT_SECRET externally.
app.jwt.secret=${JWT_SECRET:local-development-secret-must-be-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
