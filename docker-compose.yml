version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dataflowx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataflowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataflowx}
      POSTGRES_DB: ${POSTGRES_DB:-dataflowx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataflowx} -d ${POSTGRES_DB:-dataflowx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataflowx-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dataflowx}
      - DATABASE_USERNAME=${POSTGRES_USER:-dataflowx}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-dataflowx}
      - JWT_SECRET=${JWT_SECRET:-local-development-secret-must-be-at-least-32-characters}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
